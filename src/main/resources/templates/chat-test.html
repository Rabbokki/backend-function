<!DOCTYPE html>
<html>
<head>
  <title>Chat Test</title>
  <style>
    #messages { border: 1px solid #ccc; padding: 10px; height: 300px; overflow-y: auto; margin-top: 10px; }
    p { margin: 5px 0; }
    #roomForm { margin-bottom: 10px; }
    #roomList { margin-top: 10px; }
  </style>
</head>
<body>
<h2>채팅 테스트</h2>
<div id="roomForm">
  <input id="targetEmail" type="text" placeholder="상대방 이메일" style="width: 200px;">
  <button onclick="createRoom()">채팅방 생성</button>
  <input id="joinRoomName" type="text" placeholder="채팅방 이름 입력" style="width: 200px; margin-left: 10px;">
  <button onclick="joinRoom()">채팅방 입장</button>
  <button onclick="loadRoomList()" style="margin-left: 10px;">내 채팅방 목록</button>
</div>
<div id="userInfo"></div>
<input id="message" type="text" placeholder="메시지를 입력하세요" style="width: 300px;" disabled>
<button onclick="sendMessage()" disabled>전송</button>
<div id="messages"></div>
<div id="roomList"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.6.0/axios.min.js"></script>
<script>
  const baseUrl = 'http://192.168.0.71:8081';
  let stompClient = null;
  let roomId = null;
  let roomName = null;
  let sender = prompt("사용자 이메일을 입력하세요:", "abc@abc2.com") || "guest" + Math.floor(Math.random() * 100);
  const token = "eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJhYmNAYWJjMi5jb20iLCJleHAiOjE3NDI1MjQ4NzksImlhdCI6MTc0MjQzODQ3OX0.MsYrPoB_ZuS4lZwkp23a8A5Z6GpauuW-TbctyzUW0X0";

  function createRoom() {
    const targetEmail = document.getElementById('targetEmail').value.trim();
    if (!targetEmail) {
      alert('상대방 이메일을 입력하세요.');
      return;
    }
    axios.post(`${baseUrl}/chat`, { targetEmail: targetEmail }, {
      headers: { 'Access_Token': token }
    })
            .then(response => {
              const data = response.data.data;
              roomId = data.id;
              roomName = data.roomName;
              document.getElementById('messages').innerHTML += '<p>[시스템] 채팅방 생성: ' + roomName + ' (이 값을 다른 사람에게 공유하세요)</p>';
              connectWebSocket();
              document.getElementById('message').disabled = false;
              document.getElementById('message').focus();
              document.querySelector('button[onclick="sendMessage()"]').disabled = false;
              loadUserInfo(roomName);
            })
            .catch(error => {
              alert('채팅방 생성 실패: ' + (error.response?.data?.message || '서버 오류'));
            });
  }

  function joinRoom() {
    const inputRoomName = document.getElementById('joinRoomName').value.trim();
    if (!inputRoomName) {
      alert('채팅방 이름을 입력하세요.');
      return;
    }
    axios.get(`${baseUrl}/chat/${inputRoomName}`, {
      headers: { 'Access_Token': token }
    })
            .then(response => {
              const data = response.data.data;
              roomId = data.id;
              roomName = data.roomName;
              document.getElementById('messages').innerHTML += '<p>[시스템] 채팅방 입장: ' + roomName + '</p>';
              connectWebSocket();
              document.getElementById('message').disabled = false;
              document.getElementById('message').focus();
              document.querySelector('button[onclick="sendMessage()"]').disabled = false;
              loadUserInfo(roomName);
            })
            .catch(error => {
              alert('채팅방 입장 실패: ' + (error.response?.data?.message || '서버 오류'));
            });
  }

  function loadRoomList() {
    axios.get(`${baseUrl}/chat/list?page=0&size=10`, {
      headers: { 'Access_Token': token }
    })
            .then(response => {
              const rooms = response.data.content;
              let roomListHtml = '<h3>내 채팅방 목록</h3><ul>';
              rooms.forEach(room => {
                roomListHtml += `<li>${room.room.roomName} (상대방: ${room.userResponseDto.data.email})
                        <button onclick="joinRoomByName('${room.room.roomName}')">입장</button></li>`;
              });
              roomListHtml += '</ul>';
              document.getElementById('roomList').innerHTML = roomListHtml;
            })
            .catch(error => {
              alert('채팅방 목록 로드 실패: ' + (error.response?.data?.message || '서버 오류'));
            });
  }

  function joinRoomByName(name) {
    document.getElementById('joinRoomName').value = name;
    joinRoom();
  }

  function loadUserInfo(roomName) {
    axios.get(`${baseUrl}/chat/${roomName}`, {
      headers: { 'Access_Token': token }
    })
            .then(response => {
              const roomData = response.data.data;
              axios.get(`${baseUrl}/chat/list?page=0&size=10`, { headers: { 'Access_Token': token } })
                      .then(listResponse => {
                        const rooms = listResponse.data.content;
                        const roomInfo = rooms.find(r => r.room.roomName === roomName);
                        if (roomInfo) {
                          const userData = roomInfo.userResponseDto.data;
                          document.getElementById('userInfo').innerHTML =
                                  `<p>상대방: ${userData.email} (닉네임: ${userData.nickname || 'N/A'}, ID: ${userData.accountId})</p>`;
                        }
                      });
            })
            .catch(error => {
              console.error('사용자 정보 로드 실패:', error);
            });
  }

  function connectWebSocket() {
    const socket = new SockJS(`${baseUrl}/ws`);
    stompClient = Stomp.over(socket);
    stompClient.connect({}, function (frame) {
      console.log('Connected: ' + frame);
      document.getElementById('messages').innerHTML += '<p>[시스템] ' + sender + '님이 입장했습니다.</p>';
      stompClient.subscribe('/sub/chatroom' + roomName, function (message) {
        const msg = JSON.parse(message.body);
        document.getElementById('messages').innerHTML += '<p>' + msg.sender + ': ' + msg.message + '</p>';
        scrollToBottom();
      });
    }, function (error) {
      console.error('Connection error:', error);
      alert('웹소켓 연결 실패');
    });
  }

  function sendMessage() {
    const message = document.getElementById('message').value.trim();
    if (message && stompClient) {
      stompClient.send('/pub/chat', {}, JSON.stringify({
        roomId: roomId,
        message: message,
        sender: sender
      }));
      document.getElementById('message').value = '';
    }
  }

  function scrollToBottom() {
    const messagesDiv = document.getElementById('messages');
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
  }

  document.getElementById('message').addEventListener('keypress', function (e) {
    if (e.key === 'Enter') {
      sendMessage();
    }
  });
</script>
</body>
</html>
